<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اصلی</title>
    <!-- آیکون‌ها و فونت دستی -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* پس‌زمینه کاملاً یکدست و یکپارچه نئونی */
        body {
            background: radial-gradient(circle at center, #1e1035 0%, #0d0818 60%, #05030a 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* 1. هدر بالای صفحه */
        .header-section {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            z-index: 1;
        }

        .date-box, .day-box {
            font-size: 15px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #cbd5e1;
        }

        .holiday {
            color: #f43f5e !important;
            border-color: rgba(244, 63, 94, 0.4) !important;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.25);
        }

        /* بخش Welcome و خطوط ساده بالا/پایین */
        .welcome-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .welcome-title {
            font-family: 'Great Vibes', cursive, sans-serif;
            font-size: 52px;
            font-weight: 400;
            letter-spacing: 2px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 25px rgba(168, 85, 247, 0.5);
            line-height: 1.2;
            padding: 0 10px;
        }

        /* خطوط منحنی تمیز بدون نقطه‌ها و آیکون */
        .flourish-line {
            width: 180px;
            height: 12px;
            fill: none;
            stroke: #a855f7;
            stroke-width: 1.5;
            opacity: 0.8;
            filter: drop-shadow(0 0 5px rgba(168, 85, 247, 0.6));
        }

        /* 2. دکمه‌های شفاف و استوانه‌ای */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 380px;
            z-index: 1;
            margin: 30px 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(168, 85, 247, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.35);
        }

        /* 3. فوتر و شبکه‌های اجتماعی (تنظیم چپ به راست برای آیدی و آیکون) */
        footer {
            display: flex;
            gap: 25px;
            align-items: center;
            justify-content: center;
            z-index: 1;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            dir: ltr; /* جهت چپ به راست برای آیدی */
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
            direction: ltr;
        }

        .social-link:hover {
            color: #a855f7;
        }

        .social-link i {
            font-size: 18px;
        }

        @media (max-width: 600px) {
            .header-section {
                flex-direction: column-reverse;
                gap: 15px;
            }
            .welcome-title {
                font-size: 44px;
            }
            .flourish-line {
                width: 150px;
            }
        }
    </style>
</head>
<body>

    <!-- هدر بالای صفحه -->
    <header class="header-section">
        <!-- تاریخ شمسی (سمت چپ) -->
        <div class="date-box" id="current-date">--/--/--</div>

        <!-- بخش Welcome با خط بالا و پایین ساده -->
        <div class="welcome-wrapper">
            <!-- خط بالا -->
            <svg class="flourish-line" viewBox="0 0 200 15">
                <path d="M 10,10 Q 50,2 100,10 Q 150,18 190,10" />
            </svg>

            <h1 class="welcome-title">Welcome</h1>

            <!-- خط پایین -->
            <svg class="flourish-line" viewBox="0 0 200 15">
                <path d="M 10,10 Q 50,18 100,10 Q 150,2 190,10" />
            </svg>
        </div>

        <!-- روز هفته (سمت راست) -->
        <div class="day-box" id="current-day">---</div>
    </header>

    <!-- دکمه‌های اصلی -->
    <main class="main-content">
        <a href="music.html" class="nav-btn">موسیقی</a>
        <a href="articles.html" class="nav-btn">مقالات</a>
        <a href="fun.html" class="nav-btn">سرگرمی</a>
    </main>

    <!-- فوتر (آیکون سمت چپ آیدی و علامت @ در ابتدای آیدی) -->
    <footer>
        <a href="https://t.me/itsmmdmahdi" target="_blank" class="social-link">
            <i class="fa-brands fa-telegram" style="color: #24A1DE;"></i>
            <span>@itsmmdmahdi</span>
        </a>
        <a href="https://instagram.com/itsmmdmahdi" target="_blank" class="social-link">
            <i class="fa-brands fa-instagram" style="color: #E1306C;"></i>
            <span>@itsmmdmahdi</span>
        </a>
    </footer>

    <!-- اسکریپت تاریخ و روز -->
    <script>
        function updatePersianDate() {
            const now = new Date();
            
            const optionsDate = { year: 'numeric', month: '2-digit', day: '2-digit' };
            const persianDate = new Intl.DateTimeFormat('fa-IR', optionsDate).format(now);
            
            const optionsDay = { weekday: 'long' };
            const persianDay = new Intl.DateTimeFormat('fa-IR', optionsDay).format(now);

            const dateElement = document.getElementById('current-date');
            const dayElement = document.getElementById('current-day');

            dateElement.textContent = persianDate;
            dayElement.textContent = persianDay;

            // روزهای پنج‌شنبه (4) و جمعه (5)
            const dayOfWeek = now.getDay();
            if (dayOfWeek === 4 || dayOfWeek === 5) {
                dateElement.classList.add('holiday');
                dayElement.classList.add('holiday');
            }
        }

        updatePersianDate();
    </script>
</body>
</html>
