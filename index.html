<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موزیک‌پلییر آنلاین مهدی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
        }
        .cover-art {
            width: 200px;
            height: 200px;
            border-radius: 20px;
            margin: 0 auto 20px;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.3);
            object-fit: cover;
        }
        .track-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .track-artist {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            margin-bottom: 25px;
            border-radius: 10px;
        }
        .playlist {
            text-align: right;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }
        .playlist h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }
        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .track-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .track-item.active {
            border-right: 3px solid #ec4899;
            background: rgba(236, 72, 153, 0.1);
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="cover-art" id="cover">🎵</div>
        <div class="track-title" id="title">عنوان آهنگ</div>
        <div class="track-artist" id="artist">نام خواننده</div>

        <!-- پخش‌کننده صوتی اصلی -->
        <audio id="audio-player" controls>
            مرورگر شما از پخش آنلاین پشتیبانی نمی‌کند.
        </audio>

        <!-- لیست پخش -->
        <div class="playlist">
            <h3>لیست پخش</h3>
            <div id="playlist-container"></div>
        </div>
    </div>

    <script>
        // 🎵 لیست آهنگ‌ها (می‌توانی لینک‌های تلگرام یا هر لینک دیگری را اینجا بگذاری)
        const playlist = [
            {
                title: "آهنگ نمونه ۱",
                artist: "خواننده اول",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                cover: "🎧"
            },
            {
                title: "آهنگ نمونه ۲",
                artist: "خواننده دوم",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                cover: "🎸"
            }
        ];

        let currentTrack = 0;
        const audio = document.getElementById('audio-player');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const cover = document.getElementById('cover');
        const playlistContainer = document.getElementById('playlist-container');

        function loadTrack(index) {
            currentTrack = index;
            const track = playlist[index];
            title.textContent = track.title;
            artist.textContent = track.artist;
            cover.textContent = track.cover;
            audio.src = track.url;
            updatePlaylistUI();
        }

        function updatePlaylistUI() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `track-item ${index === currentTrack ? 'active' : ''}`;
                item.innerHTML = `<span>${track.title} - ${track.artist}</span> <span>►</span>`;
                item.onclick = () => {
                    loadTrack(index);
                    audio.play();
                };
                playlistContainer.appendChild(item);
            });
        }

        // بارگذاری آهنگ اول موقع ورود
        loadTrack(0);
    </script>
</body>
</html>
