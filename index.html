<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اصلی | وب‌سایت مهدی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .main-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(45deg, #3b82f6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 15px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        .btn-icon {
            font-size: 20px;
        }
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="profile-img">🌐</div>
        <h1>به وب‌سایت من خوش آمدید</h1>
        <p class="subtitle">یک فضای اختصاصی برای پخش موزیک، مقالات و ارتباط با من</p>

        <!-- دکمه‌های هدایت به فایل‌های جداگانه -->
        <div class="nav-buttons">
            <a href="music.html" class="btn">
                <span>🎵 پخش آنلاین موزیک</span>
                <span class="btn-icon">➔</span>
            </a>
            
            <a href="articles.html" class="btn">
                <span>📝 وبلاگ و مقالات</span>
                <span class="btn-icon">➔</span>
            </a>

            <a href="about.html" class="btn">
                <span>👤 درباره من و ارتباط</span>
                <span class="btn-icon">➔</span>
            </a>
        </div>

        <footer>طراحی و اجرا توسط مهدی • ۲۰۲۶</footer>
    </div>

</body>
</html>
