<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وب‌سایت شخصی مهدی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p.bio {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: block;
            padding: 14px 20px;
            background: #334155;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .link-btn:hover {
            background: #3b82f6;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">👨‍💻</div>
        <h1>محمد مهدی</h1>
        <p class="bio">به وب‌سایت شخصی من خوش آمدید! علاقه‌مند به تکنولوژی، یادگیری و ساخت پروژه‌های جدید.</p>
        
        <div class="links">
            <a href="https://t.me/itsmmdmahdi" target="_blank" class="link-btn">💬 ارتباط در تلگرام</a>
            <a href="https://github.com/itsmmdmahdi" target="_blank" class="link-btn">🐙 صفحه گیتهاب من</a>
            <a href="mailto:example@gmail.com" class="link-btn">✉️ ارسال ایمیل</a>
        </div>

        <footer>ساخته شده با GitHub Pages</footer>
    </div>
</body>
</html>
