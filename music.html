<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Dashboard</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: #0f0c20;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            display: flex;
            width: 100%;
            max-width: 1280px;
            height: 850px;
            background: rgba(23, 19, 43, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* 1. Left Sidebar Navigation */
        .sidebar {
            width: 80px;
            background: rgba(18, 14, 33, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            gap: 25px;
        }
        .logo {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #e11d48, #be123c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.4);
        }
        .nav-icon {
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            width: 45px;
            height: 45px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .nav-icon:hover, .nav-icon.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        /* 2. Main Content Area */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 320px;
        }
        .search-box input {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 14px;
        }
        
        /* Categories Pills */
        .categories {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .cat-pill {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            font-size: 13px;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.3s;
        }
        .cat-pill:hover, .cat-pill.active {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        /* Hero Banner */
        .hero-banner {
            height: 180px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 22px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        }
        .hero-text h2 { font-size: 28px; margin-bottom: 8px; }
        .hero-text p { font-size: 14px; opacity: 0.8; }

        /* Track List (Trending) */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #f8fafc;
        }
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            transition: 0.2s;
        }
        .track-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .track-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .track-num { color: #64748b; font-size: 14px; width: 20px; }
        .track-cover-sm {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .track-meta h4 { font-size: 14px; font-weight: 600; }
        .track-meta p { font-size: 12px; color: #94a3b8; }
        
        .track-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .btn-icon-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            font-size: 13px;
        }
        .btn-icon-action:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .btn-icon-action.liked {
            color: #38bdf8;
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        /* 3. Right Player Panel */
        .player-panel {
            width: 360px;
            background: rgba(15, 12, 32, 0.95);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .player-cover {
            width: 240px;
            height: 240px;
            border-radius: 25px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            margin-top: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .player-details {
            text-align: center;
            margin: 20px 0;
        }
        .player-details h3 { font-size: 20px; margin-bottom: 5px; }
        .player-details p { font-size: 14px; color: #94a3b8; }

        /* Controls LTR */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .btn-play-lg {
            width: 60px;
            height: 60px;
            background: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            transition: 0.2s;
        }
        .btn-play-lg:hover { transform: scale(1.05); }

        .progress-bar-wrap {
            width: 100%;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #6366f1;
        }
        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="logo"><i class="fa-solid fa-compact-disc"></i></div>
            <a href="#" class="nav-icon active" title="Home"><i class="fa-solid fa-house"></i></a>
            <a href="index.html" class="nav-icon" title="Main Site"><i class="fa-solid fa-arrow-left"></i></a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header Search -->
            <div class="header-bar">
                <h1 style="font-size: 24px;">Music Hub</h1>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" style="color: #64748b;"></i>
                    <input type="text" id="search-input" placeholder="Search song or artist..." oninput="handleSearch()">
                </div>
            </div>

            <!-- Categories -->
            <div class="categories">
                <div class="cat-pill active" onclick="filterCategory('all', this)">All Songs</div>
                <div class="cat-pill" onclick="filterCategory('happy', this)">Happy</div>
                <div class="cat-pill" onclick="filterCategory('sad', this)">Sad</div>
                <div class="cat-pill" onclick="filterCategory('remix', this)">Remix</div>
                <div class="cat-pill" onclick="filterCategory('rap', this)">Rap</div>
                <div class="cat-pill" onclick="filterCategory('liked', this)">Most Liked 👍</div>
                <div class="cat-pill" onclick="filterCategory('my_playlist', this)">My Playlist ❤️</div>
            </div>

            <!-- Hero Banner -->
            <div class="hero-banner">
                <div class="hero-text">
                    <h2>Trending Tracks</h2>
                    <p>Listen to the most popular uploaded music on Catbox</p>
                </div>
            </div>

            <!-- Track List -->
            <div>
                <div class="section-title" id="section-heading">All Tracks</div>
                <div class="track-list" id="track-list-container">
                    <!-- Tracks rendered via JS -->
                </div>
            </div>
        </div>

        <!-- Right Player Panel -->
        <div class="player-panel">
            <div class="player-cover" id="player-cover">🎵</div>
            <div class="player-details">
                <h3 id="player-title">Select a Track</h3>
                <p id="player-artist">Artist Name</p>
            </div>

            <!-- Controls -->
            <div class="player-controls">
                <div class="btn-icon-action" onclick="prevTrack()"><i class="fa-solid fa-backward"></i></div>
                <div class="btn-play-lg" id="play-btn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></div>
                <div class="btn-icon-action" onclick="nextTrack()"><i class="fa-solid fa-forward"></i></div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-wrap">
                <input type="range" id="progress-bar" value="0" min="0" max="100" oninput="seekTrack(this.value)">
                <div class="time-labels">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <audio id="audio-element"></audio>
        </div>
    </div>

    <script>
        // 🎵 Master Song Database (Categories support arrays)
        const masterSongs = [
            {
                id: 1,
                title: "Energy Remix",
                artist: "DJ Shadow",
                category: ["happy", "remix"],
                url: "https://files.catbox.moe/a1b2c3.mp3",
                cover: "🔥",
                likes: 12
            },
            {
                id: 2,
                title: "Sad Rain Beats",
                artist: "LoFi Chill",
                category: ["sad"],
                url: "https://files.catbox.moe/x9y8z7.mp3",
                cover: "🌧️",
                likes: 8
            },
            {
                id: 3,
                title: "Rap Legend",
                artist: "MC Fast",
                category: ["rap", "happy"],
                url: "https://files.catbox.moe/m4n5o6.mp3",
                cover: "🎤",
                likes: 25
            }
        ];

        // Local Storage State for User Likes & Playlist
        let userLikes = JSON.parse(localStorage.getItem('user_likes') || '[]');
        let userPlaylist = JSON.parse(localStorage.getItem('user_playlist') || '[]');

        let currentPlaylist = [...masterSongs];
        let currentIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const playerTitle = document.getElementById('player-title');
        const playerArtist = document.getElementById('player-artist');
        const playerCover = document.getElementById('player-cover');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const trackListContainer = document.getElementById('track-list-container');

        // Render Track List
        function renderTrackList(songs) {
            trackListContainer.innerHTML = '';
            if (songs.length === 0) {
                trackListContainer.innerHTML = '<p style="color:#64748b; padding:20px;">No tracks found.</p>';
                return;
            }

            songs.forEach((song, index) => {
                const isLiked = userLikes.includes(song.id);
                const inPlaylist = userPlaylist.includes(song.id);
                const totalLikes = song.likes + (isLiked ? 1 : 0);

                const itemHtml = `
                    <div class="track-item">
                        <div class="track-left">
                            <span class="track-num">${index + 1}</span>
                            <div class="track-cover-sm">${song.cover}</div>
                            <div class="track-meta">
                                <h4>${song.title}</h4>
                                <p>${song.artist}</p>
                            </div>
                        </div>
                        <div class="track-actions">
                            <!-- Play Button -->
                            <button class="btn-icon-action" onclick="playSpecificTrack(${song.id})"><i class="fa-solid fa-play"></i></button>
                            
                            <!-- Youtube Style Transparent Like Button -->
                            <button class="btn-icon-action ${isLiked ? 'liked' : ''}" onclick="toggleLike(${song.id})">
                                <i class="fa-regular fa-thumbs-up"></i>
                                <span style="font-size:11px; margin-left:4px;">${totalLikes}</span>
                            </button>

                            <!-- Add to Personal Playlist Button -->
                            <button class="btn-icon-action ${inPlaylist ? 'liked' : ''}" onclick="togglePlaylist(${song.id})" title="Add to My Playlist">
                                <i class="fa-solid ${inPlaylist ? 'fa-check' : 'fa-plus'}"></i>
                            </button>

                            <!-- Direct Download Button -->
                            <a href="${song.url}" download class="btn-icon-action" title="Download MP3" target="_blank"><i class="fa-solid fa-download"></i></a>
                        </div>
                    </div>
                `;
                trackListContainer.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        // Category Filtering
        function filterCategory(cat, element) {
            document.querySelectorAll('.cat-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('section-heading').textContent = element.textContent;

            if (cat === 'all') {
                currentPlaylist = [...masterSongs];
            } else if (cat === 'liked') {
                // Sort by Most Liked
                currentPlaylist = [...masterSongs].sort((a, b) => {
                    const likesA = a.likes + (userLikes.includes(a.id) ? 1 : 0);
                    const likesB = b.likes + (userLikes.includes(b.id) ? 1 : 0);
                    return likesB - likesA;
                });
            } else if (cat === 'my_playlist') {
                currentPlaylist = masterSongs.filter(s => userPlaylist.includes(s.id));
            } else {
                currentPlaylist = masterSongs.filter(s => 
                    Array.isArray(s.category) ? s.category.includes(cat) : s.category === cat
                );
            }
            renderTrackList(currentPlaylist);
        }

        // Live Search Filter
        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = masterSongs.filter(s => 
                s.title.toLowerCase().includes(query) || s.artist.toLowerCase().includes(query)
            );
            renderTrackList(filtered);
        }

        // Toggle Like (No Login Required - Saved in LocalStorage)
        function toggleLike(songId) {
            if (userLikes.includes(songId)) {
                userLikes = userLikes.filter(id => id !== songId);
            } else {
                userLikes.push(songId);
            }
            localStorage.setItem('user_likes', JSON.stringify(userLikes));
            renderTrackList(currentPlaylist);
        }

        // Toggle Personal Playlist
        function togglePlaylist(songId) {
            if (userPlaylist.includes(songId)) {
                userPlaylist = userPlaylist.filter(id => id !== songId);
            } else {
                userPlaylist.push(songId);
            }
            localStorage.setItem('user_playlist', JSON.stringify(userPlaylist));
            renderTrackList(currentPlaylist);
        }

        // Player Functions
        function loadTrack(index) {
            const track = currentPlaylist[index];
            if (!track) return;
            playerTitle.textContent = track.title;
            playerArtist.textContent = track.artist;
            playerCover.textContent = track.cover;
            audio.src = track.url;
        }

        function playSpecificTrack(id) {
            const index = currentPlaylist.findIndex(s => s.id === id);
            if (index !== -1) {
                currentIndex = index;
                loadTrack(currentIndex);
                playTrack();
            }
        }

        function playTrack() {
            isPlaying = true;
            audio.play();
            playBtn.innerHTM
