<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player & Hub</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: #0b0914;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .app-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            max-height: 850px;
            background: rgba(18, 14, 33, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        /* 1. Left Sidebar Navigation */
        .sidebar {
            width: 70px;
            background: rgba(13, 10, 25, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            z-index: 10;
            flex-shrink: 0;
        }
        .logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #e11d48, #be123c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.4);
        }
        .nav-icon {
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
            transition: 0.25s;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: transparent;
            border: none;
        }
        .nav-icon:hover, .nav-icon.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 2. Full Player View (Default) */
        .full-player-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .player-cover-lg {
            width: 240px;
            height: 240px;
            border-radius: 28px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 25px;
        }
        .player-info-lg {
            text-align: center;
            margin-bottom: 20px;
        }
        .player-info-lg h2 { font-size: 22px; margin-bottom: 6px; }
        .player-info-lg p { font-size: 14px; color: #94a3b8; }

        .player-controls-lg {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .btn-play-lg {
            width: 60px;
            height: 60px;
            background: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            transition: 0.2s;
        }
        .btn-play-lg:hover { transform: scale(1.06); }

        .progress-box-lg {
            width: 100%;
            max-width: 360px;
        }

        /* 3. Music Hub View */
        .hub-view {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: none; /* Managed by JS */
            flex-direction: column;
            gap: 20px;
            padding-bottom: 100px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .search-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }
        .search-box input {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 13px;
        }

        /* Category Filter Pills */
        .categories {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .cat-pill {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-pill:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
        .cat-pill.active {
            background: #6366f1 !important;
            color: #fff !important;
            border-color: #6366f1 !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Track Items */
        .track-list { display: flex; flex-direction: column; gap: 8px; }
        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            transition: 0.2s;
        }
        .track-item:hover { background: rgba(255, 255, 255, 0.08); }
        .track-left { display: flex; align-items: center; gap: 12px; }
        .track-cover-sm {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #282043;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .track-meta h4 { font-size: 13px; font-weight: 600; }
        .track-meta p { font-size: 11px; color: #94a3b8; }
        .track-actions { display: flex; align-items: center; gap: 8px; }

        .btn-icon-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            font-size: 12px;
        }
        .btn-icon-action:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
        .btn-icon-action.liked {
            color: #38bdf8;
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        /* 4. Bottom Player Bar */
        .bottom-player-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(12, 9, 22, 0.96);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
        }
        .bottom-left { display: flex; align-items: center; gap: 12px; width: 180px; }
        .bottom-cover {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .bottom-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex: 1;
            max-width: 380px;
        }

        /* Shared Range Inputs */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6366f1;
        }
        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="logo"><i class="fa-solid fa-compact-disc"></i></div>
            
            <button class="nav-icon active" id="btn-nav-player" onclick="switchView('player')" title="Now Playing">
                <i class="fa-solid fa-music"></i>
            </button>

            <button class="nav-icon" id="btn-nav-hub" onclick="switchView('hub')" title="Music Hub">
                <i class="fa-solid fa-layer-group"></i>
            </button>

            <button class="nav-icon" onclick="switchView('hub'); filterCategory('my_playlist', document.querySelector('.cat-pill:last-child'));" title="My Playlists">
                <i class="fa-solid fa-heart"></i>
            </button>

            <a href="index.html" class="nav-icon" title="Main Site" style="margin-top: auto;">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>

        <!-- Content Area -->
        <div class="content-area">

            <!-- VIEW 1: Full Size Player -->
            <div class="full-player-view" id="full-player-view">
                <div class="player-cover-lg" id="player-cover-lg">🎵</div>
                <div class="player-info-lg">
                    <h2 id="player-title-lg">Select a Track</h2>
                    <p id="player-artist-lg">Artist Name</p>
                </div>
                <div class="player-controls-lg">
                    <button class="btn-icon-action" style="width:44px; height:44px;" onclick="prevTrack()"><i class="fa-solid fa-backward"></i></button>
                    <div class="btn-play-lg" id="play-btn-lg" onclick="togglePlay()"><i class="fa-solid fa-play"></i></div>
                    <button class="btn-icon-action" style="width:44px; height:44px;" onclick="nextTrack()"><i class="fa-solid fa-forward"></i></button>
                </div>
                <div class="progress-box-lg">
                    <input type="range" id="progress-bar-lg" value="0" min="0" max="100" oninput="seekTrack(this.value)">
                    <div class="time-labels">
                        <span id="current-time-lg">0:00</span>
                        <span id="duration-lg">0:00</span>
                    </div>
                </div>
            </div>

            <!-- VIEW 2: Music Hub Dashboard -->
            <div class="hub-view" id="hub-view">
                <div class="header-bar">
                    <h1 style="font-size: 20px;">Music Hub</h1>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass" style="color: #64748b;"></i>
                        <input type="text" id="search-input" placeholder="Search song or artist..." oninput="handleSearch()">
                    </div>
                </div>

                <!-- Categories -->
                <div class="categories">
                    <div class="cat-pill active" onclick="filterCategory('all', this)">All Songs</div>
                    <div class="cat-pill" onclick="filterCategory('happy', this)">Happy</div>
                    <div class="cat-pill" onclick="filterCategory('sad', this)">Sad</div>
                    <div class="cat-pill" onclick="filterCategory('remix', this)">Remix</div>
                    <div class="cat-pill" onclick="filterCategory('rap', this)">Rap</div>
                    <div class="cat-pill" onclick="filterCategory('liked', this)">Most Liked 👍</div>
                    <div class="cat-pill" onclick="filterCategory('my_playlist', this)">My Playlist ❤️️</div>
                </div>

                <!-- Track List -->
                <div>
                    <div style="font-size: 15px; font-weight:600; margin:10px 0;" id="section-heading">All Tracks</div>
                    <div class="track-list" id="track-list-container">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>

            <!-- Bottom Player Bar (Shown in Hub View) -->
            <div class="bottom-player-bar" id="bottom-player-bar">
                <div class="bottom-left">
                    <div class="bottom-cover" id="bottom-cover">🎵</div>
                    <div style="overflow: hidden;">
                        <h4 id="bottom-title" style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Select a Track</h4>
                        <p id="bottom-artist" style="font-size: 11px; color:#94a3b8;">Artist Name</p>
                    </div>
                </div>

                <div class="bottom-controls">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button class="btn-icon-action" style="width:30px; height:30px;" onclick="prevTrack()"><i class="fa-solid fa-backward"></i></button>
                        <button class="btn-icon-action" style="width:36px; height:36px; background:#6366f1; color:#fff;" id="play-btn-sm" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
                        <button class="btn-icon-action" style="width:30px; height:30px;" onclick="nextTrack()"><i class="fa-solid fa-forward"></i></button>
                    </div>
                    <input type="range" id="progress-bar-sm" value="0" min="0" max="100" oninput="seekTrack(this.value)" style="width: 220px;">
                </div>

                <button class="btn-icon-action" onclick="switchView('player')" title="Expand Player">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>

        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        // Tracks Database
        const masterSongs = [
            { id: 1, title: "Energy Remix", artist: "DJ Shadow", category: ["happy", "remix"], url: "https://files.catbox.moe/a1b2c3.mp3", cover: "🔥", likes: 12 },
            { id: 2, title: "Sad Rain Beats", artist: "LoFi Chill", category: ["sad"], url: "https://files.catbox.moe/x9y8z7.mp3", cover: "🌧", likes: 8 },
            { id: 3, title: "Rap Legend", artist: "MC Fast", category: ["rap", "happy"], url: "https://files.catbox.moe/m4n5o6.mp3", cover: "🎤", likes: 25 }
        ];

        let userLikes = JSON.parse(localStorage.getItem('user_likes') || '[]');
        let userPlaylist = JSON.parse(localStorage.getItem('user_playlist') || '[]');

        let currentPlaylist = [...masterSongs];
        let currentIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById('audio-element');

        // View Switcher (Player vs Music Hub)
        function switchView(viewName) {
            const fullPlayer = document.getElementById('full-player-view');
            const hubView = document.getElementById('hub-view');
            const bottomBar = document.getElementById('bottom-player-bar');
            
            document.getElementById('btn-nav-player').classList.remove('active');
            document.getElementById('btn-nav-hub').classList.remove('active');

            if (viewName === 'player') {
                fullPlayer.style.display = 'flex';
                hubView.style.display = 'none';
                bottomBar.style.display = 'none';
                document.getElementById('btn-nav-player').classList.add('active');
            } else {
                fullPlayer.style.display = 'none';
                hubView.style.display = 'flex';
                bottomBar.style.display = 'flex';
                document.getElementById('btn-nav-hub').classList.add('active');
            }
        }

        // Render Track Items
        function renderTrackList(songs) {
            const container = document.getElementById('track-list-container');
            container.innerHTML = '';
            if (songs.length === 0) {
                container.innerHTML = '<p style="color:#64748b; padding:15px; font-size:13px;">No tracks found.</p>';
                return;
            }

            songs.forEach((song) => {
                const isLiked = userLikes.includes(song.id);
                const inPlaylist = userPlaylist.includes(song.id);
                const totalLikes = song.likes + (isLiked ? 1 : 0);

                const itemHtml = `
                    <div class="track-item">
                        <div class="track-left">
                            <div class="track-cover-sm">${song.cover}</div>
                            <div class="track-meta">
                                <h4>${song.title}</h4>
                                <p>${song.artist}</p>
                            </div>
                        </div>
                        <div class="track-actions">
                            <button class="btn-icon-action" onclick="playSpecificTrack(${song.id})"><i class="fa-solid fa-play"></i></button>
                            
                            <button class="btn-icon-action ${isLiked ? 'liked' : ''}" onclick="toggleLike(${song.id})">
                                <i class="fa-regular fa-thumbs-up"></i>
                                <span style="font-size:10px; margin-left:3px;">${totalLikes}</span>
                            </button>

                            <button class="btn-icon-action ${inPlaylist ? 'liked' : ''}" onclick="togglePlaylist(${song.id})" title="Add to My Playlist">
                                <i class="fa-solid ${inPlaylist ? 'fa-check' : 'fa-plus'}"></i>
                            </button>

                            <a href="${song.url}" download class="btn-icon-action" title="Download MP3" target="_blank"><i class="fa-solid fa-download"></i></a>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        // Category Filter Function
        function filterCategory(cat, element) {
            const pills = document.querySelectorAll('.cat-pill');
            pills.forEach(p => p.classList.remove('active'));
            if(element) element.classList.add('active');

            document.getElementById('section-heading').textContent = element ? element.textContent : 'Tracks';
