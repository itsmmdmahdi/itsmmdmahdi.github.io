<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسیقی</title>
    <!-- آیکون‌های FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* تم و پس‌زمینه نئونی هماهنگ با صفحه اصلی */
        body {
            background: radial-gradient(circle at center, #1e1035 0%, #0d0818 60%, #05030a 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 90px; /* فضا برای پلیر شناور پایین */
            overflow-x: hidden;
        }

        /* هدر بالای صفحه: نوار جستجو و دکمه سه نقطه */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            position: sticky;
            top: 0;
            background: rgba(13, 8, 24, 0.85);
            backdrop-filter: blur(15px);
            z-index: 10;
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            padding: 8px 16px;
            gap: 10px;
        }

        .search-box i {
            color: #94a3b8;
            font-size: 14px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 14px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-btn:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: rgba(168, 85, 247, 0.6);
        }

        /* محتوای اصلی */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #a855f7;
            border-radius: 2px;
            display: inline-block;
        }

        /* لیست آهنگ‌ها */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
            direction: ltr; /* از چپ به راست */
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(168, 85, 247, 0.3);
            transform: translateX(3px);
        }

        /* آهنگ در حال پخش */
        .song-item.active {
            background: rgba(168, 85, 247, 0.18) !important;
            border-color: rgba(168, 85, 247, 0.6) !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .song-left {
            display: flex;
            align-items: center;
            gap: 15px;
            overflow: hidden;
        }

        .song-number {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            min-width: 20px;
            text-align: center;
        }

        .song-item.active .song-number {
            color: #a855f7;
        }

        .song-info {
            display: flex;
            flex-direction: column;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }

        .song-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .song-artist {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .song-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .song-time {
            font-size: 13px;
            color: #94a3b8;
        }

        .download-btn {
            color: #cbd5e1;
            font-size: 15px;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
            text-decoration: none;
        }

        .download-btn:hover {
            color: #a855f7;
            background: rgba(255, 255, 255, 0.1);
        }

        /* -------------------------------------------------------------
           نوار پخش‌کننده موسیقی ثابت در پایین صفحه (Mini Player)
        ------------------------------------------------------------- */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 10, 32, 0.92);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(168, 85, 247, 0.3);
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .mini-player-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            direction: ltr; /* سمت چپ دکمه استپ/پخش، سمت راست نام */
        }

        .mini-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-play-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #a855f7;
            color: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
            transition: 0.2s;
        }

        .mini-play-btn:hover {
            transform: scale(1.05);
        }

        .mini-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .mini-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .mini-artist {
            font-size: 12px;
            color: #94a3b8;
        }

        .mini-right {
            display: flex;
            align-items: center;
        }

        .mini-time {
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 500;
        }

        /* نوار پیشروی خیلی نازک بالای یا پایین مینی‌پلیر */
        .mini-progress-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            pointer-events: none; /* غیرقابل کشیدن در حالت مینی */
        }

        .mini-progress-bar {
            height: 100%;
            width: 0%;
            background: #a855f7;
            box-shadow: 0 0 8px #a855f7;
            transition: width 0.1s linear;
        }

        /* -------------------------------------------------------------
           پخش‌کننده تمام صفحه (Full-Screen Player)
        ------------------------------------------------------------- */
        .full-player {
            position: fixed;
            top: 100%; /* مخفی در حالت اولیه */
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, #241442 0%, #0d0818 80%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 24px;
            transition: top 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .full-player.active {
            top: 0; /* نمایش تمام صفحه */
        }

        /* بالای پلیر تمام‌صفحه: فلش بازگشت */
        .full-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: rgba(168, 85, 247, 0.3);
        }

        /* بخش وسط: آلبوم و ویژوالایزر */
        .full-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: auto 0;
        }

        .album-cover {
            width: 230px;
            height: 230px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(168, 85, 247, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* ویژوالایزر (شکلک‌های متحرک با موسیقی) */
        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 35px;
            margin-top: 10px;
        }

        .bar {
            width: 4px;
            background: #a855f7;
            border-radius: 2px;
            height: 5px;
            transition: height 0.1s ease;
        }

        /* انیمیشن ویژوالایزر هنگام پخش */
        .playing .bar {
            animation: bounce 0.6s infinite alternate ease-in-out;
        }

        .playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .bar:nth-child(2) { animation-delay: 0.3s; }
        .playing .bar:nth-child(3) { animation-delay: 0.5s; }
        .playing .bar:nth-child(4) { animation-delay: 0.2s; }
        .playing .bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes bounce {
            0% { height: 5px; opacity: 0.4; }
            100% { height: 35px; opacity: 1; box-shadow: 0 0 10px #a855f7; }
        }

        /* بخش پایین: کنترل‌ها و نوار پیشروی قابل لمس */
        .full-controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
        }

        /* نوار پیشروی و زمان بالا/وسط آن */
        .full-progress-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .full-time-display {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            direction: ltr;
        }

        .full-seek-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            cursor: pointer;
        }

        .full-seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 0 10px #a855f7;
        }

        /* دکمه‌های کنترل پنج‌گانه */
        .full-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr; /* مرتب‌سازی طبق خواسته شما */
            padding: 0 10px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .ctrl-btn:hover {
            color: #a855f7;
            background: rgba(255, 255, 255, 0.05);
        }

        .ctrl-btn.active-mode {
            color: #a855f7;
            text-shadow: 0 0 10px #a855f7;
        }

        .main-play-btn {
            width: 60px;
            height: 60px;
            background: #a855f7;
            color: #fff;
            border-radius: 50%;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
        }

        .main-play-btn:hover {
            transform: scale(1.08);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- هدر بالای صفحه -->
    <header class="top-header">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="جستجوی آهنگ یا خواننده...">
        </div>
        <button class="menu-btn" title="منو">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
    </header>

    <!-- محتوای اصلی و لیست جدیدترین‌ها -->
    <main class="container">
        <h2 class="section-title">جدیدترین‌ها</h2>
        <div class="song-list" id="songList">
            <!-- آهنگ‌ها توسط جاوااسکریپت به صورت پویا رندر می‌شوند -->
        </div>
    </main>

    <!-- نوار پخش‌کننده شناور پایین (Mini Player) -->
    <div class="mini-player" id="miniPlayer">
        <div class="mini-progress-container">
            <div class="mini-progress-bar" id="miniProgressBar"></div>
        </div>
        <div class="mini-player-content">
            <div class="mini-left">
                <button class="mini-play-btn" id="miniPlayBtn">
                    <i class="fa-solid fa-play"></i>
                </button>
                <div class="mini-info">
                    <span class="mini-title" id="miniTitle">انتخاب آهنگ</span>
                    <span class="mini-artist" id="miniArtist">---</span>
                </div>
            </div>
            <div class="mini-right">
                <span class="mini-time" id="miniTime">0:00 / 0:00</span>
            </div>
        </div>
    </div>

    <!-- پخش‌کننده تمام‌صفحه (Full-Screen Player) -->
    <div class="full-player" id="fullPlayer">
        <!-- بالای پلیر: فلش برگشت -->
        <div class="full-header">
            <button class="back-btn" id="backBtn">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
        </div>

        <!-- وسط پلیر: عکس آلبوم و ویژوالایزر -->
        <div class="full-body">
            <img src="https://via.placeholder.com/300/1e1035/ffffff?text=Music" alt="Album Cover" class="album-cover" id="fullAlbumCover">
            
            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <!-- پایین پلیر: کنترل‌ها و نوار زمان -->
        <div class="full-controls-wrapper">
            <!-- نوار زمان و تایم بالای آن -->
            <div class="full-progress-container">
                <div class="full-time-display" id="fullTimeDisplay">0:00 / 0:00</div>
                <input type="range" class="full-seek-slider" id="fullSeekSlider" value="0" min="0" max="100">
            </div>

            <!-- دکمه‌های کنترلی طبق ترتیب درخواستی (از چپ به راست) -->
            <!-- 1. حالت پخش | 2. آهنگ قبلی | 3. پخش/توقف | 4. آهنگ بعدی | 5. دانلود -->
            <div class="full-controls">
                <button class="ctrl-btn" id="repeatBtn" title="حالت پخش">
                    <i class="fa-solid fa-repeat" id="repeatIcon"></i>
                </button>
                <button class="ctrl-btn" id="prevBtn" title="قبلی">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="ctrl-btn main-play-btn" id="fullPlayBtn" title="پخش/توقف">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="ctrl-btn" id="nextBtn" title="بعدی">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <a href="#" class="ctrl-btn" id="fullDownloadBtn" download title="دانلود">
                    <i class="fa-solid fa-download"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- عنصر صوتی مخفی -->
    <audio id="audioPlayer"></audio>

    <!-- اسکریپت اصلی مدیریت پخش موسیقی -->
    <script>
        // دیتابیس آهنگ‌ها (می‌توانی لینک‌های آهنگ‌ها و عکس‌های خودت را قرار دهی)
        const songs = [
            {
                id: 1,
                title: "Shayea - In Manam",
                artist: "Shayea",
                duration: "3:45",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                cover: "https://picsum.photos/id/1025/300/300"
            },
            {
                id: 2,
                title: "Yas - Sarakob",
                artist: "Yas",
                duration: "4:12",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                cover: "https://picsum.photos/id/1062/300/300"
            },
            {
                id: 3,
                title: "Mohsen Yeganeh - Behet Ghol Midam",
                artist: "Mohsen Yeganeh",
                duration: "5:05",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                cover: "https://picsum.photos/id/146/300/300"
            }
        ];

        let currentSongIndex = -1;
        let isPlaying = false;
        let playMode = 'normal'; // normal, repeat-one, repeat-all, random

        const audio = document.getElementById('audioPlayer');
        const songListEl = document.getElementById('songList');
        const miniPlayer = document.getElementById('miniPlayer');
        const fullPlayer = document.getElementById('fullPlayer');
        
        // المان‌های مینی پلیر
        const miniPlayBtn = document.getElementById('miniPlayBtn');
        const miniTitle = document.getElementById('miniTitle');
        const miniArtist = document.getElementById('miniArtist');
        const miniTime = document.getElementById('miniTime');
        const miniProgressBar = document.getElementById('miniProgressBar');

        // المان‌های پلیر تمام صفحه
        const backBtn = document.getElementById('backBtn');
        const fullAlbumCover = document.getElementById('fullAlbumCover');
        const visualizer = document.getElementById('visualizer');
        const fullTimeDisplay = document.getElementById('fullTimeDisplay');
        const fullSeekSlider = document.getElementById('fullSeekSlider');
        const fullPlayBtn = document.getElementById('fullPlayBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const repeatIcon = document.getElementById('repeatIcon');
        const fullDownloadBtn = document.getElementById('fullDownloadBtn');

        // رندر کردن لیست آهنگ‌ها
        function renderSongs(list) {
            songListEl.innerHTML = '';
            list.forEach((song, index) => {
                const isCurrent = index === currentSongIndex;
                const songEl = document.createElement('div');
                songEl.className = `song-item ${isCurrent ? 'active' : ''}`;
                
                songEl.innerHTML = `
                    <div class="song-left">
                        <span class="song-number">
                            ${isCurrent && isPlaying ? '<i class="fa-solid fa-play" style="color:#a855f7;"></i>' : index + 1}
                        </span>
                        <div class="song-info">
                            <span class="song-title">${song.title}</span>
                            <span class="song-artist">${song.artist}</span>
                        </div>
                    </div>
                    <div class="song-right">
                        <span class="song-time">${song.duration}</span>
                        <a href="${song.url}" download class="download-btn" onclick="event.stopPropagation();">
                            <i class="fa-solid fa-download"></i>
                        </a>
                    </div>
                `;

                songEl.addEventListener('click', () => {
                    playSong(index);
                });

                songListEl.appendChild(songEl);
            });
        }

        // پخش آهنگ انتخاب شده
        function playSong(index) {
            if (index < 0 || index >= songs.length) return;
            currentSongIndex = index;
            const song = songs[currentSongIndex];

            audio.src = song.url;
            audio.play();
            isPlaying = true;

            updateUI();
        }

        // بروزرسانی ظاهر پلیرها
        function updateUI() {
            if (currentSongIndex === -1) return;
            const song = songs[currentSongIndex];

            // مینی پلیر
            miniTitle.textContent = song.title;
            miniArtist.textContent = song.artist;
            miniPlayBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';

            // فول پلیر
            fullAlbumCover.src = song.cover;
            fullPlayBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
            fullDownloadBtn.href = song.url;

            if (isPlaying) {
                visualizer.classList.add('playing');
            } else {
                visualizer.classList.remove('playing');
            }

            renderSongs(songs);
        }

        // پخش / توقف
        function togglePlay() {
            if (currentSongIndex === -1) {
                playSong(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play();
                isPlaying = true;
            }
            updateUI();
        }

        // آپدیت نوار پیشروی و زمان
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const cur = audio.currentTime;
            const dur = audio.duration;
            const pct = (cur / dur) * 100;

            miniProgressBar.style.width = pct + '%';
            fullSeekSlider.value = pct;

            const curMin = Math.floor(cur / 60);
            const curSec = Math.floor(cur % 60).toString().padStart(2, '0');
            const durMin = Math.floor(dur / 60);
            const durSec = Math.floor(dur % 60).toString().padStart(2, '0');

            const timeStr = `${curMin}:${curSec} / ${durMin}:${durSec}`;
            miniTime.textContent = timeStr;
            fullTimeDisplay.textContent = timeStr;
        });

        // تغییر زمان با نوار اسلایدر تمام صفحه
        fullSeekSlider.addEventListener('input', () => {
            if (!audio.duration) return;
            const seekTo = (fullSeekSlider.value / 100) * audio.duration;
            audio.currentTime = seekTo;
        });

        // رویداد انتهای آهنگ و مدیریت حالت‌های پخش
        audio.addEventListener('ended', () => {
            if (playMode === 'repeat-one') {
                audio.currentTime = 0;
                audio.play();
            } else if (playMode === 'random') {
                let randomIndex = Math.floor(Math.random() * songs.length);
                playSong(randomIndex);
            } else {
                nextSong();
            }
        });

        // آهنگ بعدی / قبلی
        function nextSong() {
            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= songs.length) nextIndex = 0;
            playSong(nextIndex);
        }

        function prevSong() {
            let prevIndex = currentSongIndex - 1;
            if (prevIndex < 0) prevIndex = songs.length - 1;
            playSong(prevIndex);
        }

        // سوئیچ حالت‌های پخش (تکرار آلبوم -> تکرار تک -> رندوم -> معمولی)
        repeatBtn.addEventListener('click', () => {
            if (playMode === 'normal') {
                playMode = 'repeat-all';
                repeatIcon.className = 'fa-solid fa-repeat';
                repeatBtn.classList.add('active-mode');
            } else if (playMode === 'repeat-all') {
                playMode = 'repeat-one';
                repeatIcon.className = 'fa-solid fa-rotate-right'; // طرح حلقه با ۱ یا مشابه
                repeatBtn.classList.add('active-mode');
            } else if (playMode === 'repeat-one') {
                playMode = 'random';
                repeatIcon.className = 'fa-solid fa-shuffle';
                repeatBtn.classList.add('active-mode');
            } else {
                playMode = 'normal';
                repeatIcon.className = 'fa-solid fa-repeat';
                repeatBtn.classList.remove('active-mode');
            }
        });

        // باز و بسته کردن پلیر تمام صفحه
        miniPlayer.addEventListener('click', (e) => {
            if (e.target.closest('#miniPlayBtn')) return; // عدم باز شدن در صورت کلیک مستقیم رو دکمه پوز
            fullPlayer.classList.add('active');
        });

        backBtn.addEventListener('click', () => {
            fullPlayer.classList.remove('active');
        });

        // کلیک دکمه‌های اصلی
        miniPlayBtn.addEventListener('click', togglePlay);
        fullPlayBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);

        // جستجو در لیست آهنگ‌ها
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = songs.filter(s => s.title.toLowerCase().includes(val) || s.artist.toLowerCase().includes(val));
            renderSongs(filtered);
        });

        // اجرای اولیه
        renderSongs(songs);
    </script>
</body>
</html>
